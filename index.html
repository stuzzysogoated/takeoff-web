<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CITE TAKEOFF</title><script>document.documentElement.dataset.theme=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap"><link rel="stylesheet" href="style.css"></head><body><div class="scene" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="floor"></i></div>
<section id="intro" class="screen on"><canvas id="ic"></canvas><img class="logo big" src="assets/logo.png" alt="CITE TAKEOFF"><button id="skip" class="ghost" style="position:absolute;right:14px;bottom:20px">Skip intro</button></section>
<section id="home" class="screen"><canvas id="hr" class="amb" aria-hidden="true"></canvas><div class="top"><div class="coins"><i class="coin"></i><b id="hc">0</b></div><div class="tools"><button id="mute" class="ico"></button><button id="theme" class="ico"></button></div><button id="av" class="avatar" aria-label="Profile"></button></div>
<main class="center"><img class="logo" src="assets/logo.png" alt="CITE TAKEOFF"><p class="sub">Tap. Ascend. Survive.</p><p class="chip" id="hs"></p>
<button id="bStart" class="btn b1">Start Game</button><button id="bShop" class="btn b2">Customize</button><button id="bBoard" class="btn b3">Leaderboards</button><button id="bMulti" class="ghost multi">Multiplayer lobby</button></main></section>
<section id="game" class="screen"><div class="stage"><canvas id="gc"></canvas>
<div class="hud"><button id="pause" class="pbtn" aria-label="Pause">II</button><div class="coins sm"><i class="coin"></i><b id="gcn">0</b></div><button id="fs" class="pbtn fs" aria-label="Toggle full screen"></button></div><div id="sc" class="score">0</div><div id="cd" class="cd"></div><div id="ov" class="ov"></div></div></section>
<section id="shop" class="screen panel"><div class="bar"><button class="ghost back">Back</button><h2>Customize</h2><div class="coins"><i class="coin"></i><b id="sc2">0</b></div></div>
<div class="tabs" role="tablist"><button class="tab" data-t="maps" role="tab">Maps</button><button class="tab" data-t="skins" role="tab">Skins</button></div><div id="grid"></div></section>
<section id="board" class="screen panel"><div class="bar"><button class="ghost back">Back</button><h2>Leaderboards</h2></div>
<div class="tabs" role="tablist"><button class="tab" data-t="global" role="tab">Global</button><button class="tab" data-t="weekly" role="tab">Weekly</button><button class="tab" data-t="lobby" role="tab">Lobby</button></div><ol id="rows" class="rows"></ol></section>
<section id="lobbyMenu" class="screen panel"><div class="bar"><button class="ghost back">Back</button><h2>Multiplayer</h2></div>
<div class="grid2"><form class="card lf" id="lcForm"><h3>Create a lobby</h3><p>Pick a name and share it. You become the Game Master.</p><label>Lobby name<input id="lcName" maxlength="16" autocomplete="off" placeholder="e.g. TAKEOFF" required></label><button class="btn b1" type="submit">Create lobby</button></form>
<form class="card lf" id="ljForm"><h3>Join a lobby</h3><p>Enter the name your Game Master shared.</p><label>Lobby name<input id="ljName" maxlength="16" autocomplete="off" placeholder="e.g. TAKEOFF" required></label><button class="btn b2" type="submit">Join lobby</button></form></div><p class="err" id="le" role="alert" style="margin-top:12px"></p></section>
<section id="lobby" class="screen panel"><div class="bar"><button class="ghost" id="lLeave">Leave</button><h2 id="lTitle"></h2></div>
<p class="sub" id="lGm" style="text-align:center;margin-bottom:12px"></p><ul id="lPlayers" class="rows"></ul><p id="lStatus" class="empty"></p>
<div class="lobby-actions"><button id="lStart" class="btn b1" hidden>Start Game</button><button id="lBoard" class="btn b3">Lobby leaderboard</button></div></section>
<section id="profile" class="screen panel"><div class="bar"><button class="ghost back">Back</button><h2>Profile</h2></div><div id="pf" class="pf"></div></section>
<div id="auth" class="modal"><form class="mbox" id="af"><h2>Sign in to save progress</h2><label>Username<input id="au" autocomplete="username" maxlength="14" required></label><label>Password<input id="ap" type="password" autocomplete="current-password" required></label><p class="err" id="ae" role="alert"></p>
<button class="btn b1" data-k="login" type="submit">Log in</button><button class="btn b2" data-k="register" type="submit">Create account</button><button class="ghost" id="guest" type="button">Play as guest (progress is not saved)</button></form></div>
<div id="toast" role="status"></div><script src="config.js"></script><script src="game.js"></script><script src="app.js"></script><script src="lobby.js"></script></body></html>
